<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beam Deflection Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 28px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #cbd5e1; margin: 14px 0 6px; }
  select, input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 15px;
  }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #6366f1;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { background: #4f46e5; }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    background: #0f172a;
    border: 1px solid #334155;
    display: none;
  }
  .result.show { display: block; }
  .result .value { font-size: 24px; font-weight: 700; color: #a5b4fc; }
  .result .label { font-size: 13px; color: #94a3b8; }
  .formula { font-size: 12px; color: #64748b; margin-top: 10px; font-style: italic; }
</style>
</head>
<body>
<div class="card">
  <h1>📐 Beam Deflection Calculator</h1>
  <p class="sub">Calculate maximum deflection for a beam under a point load</p>

  <label for="beamType">Beam Type</label>
  <select id="beamType">
    <option value="simply-supported">Simply Supported (load at center)</option>
    <option value="cantilever">Cantilever (load at free end)</option>
  </select>

  <label for="load">Load, P (N)</label>
  <input type="number" id="load" placeholder="e.g. 500" value="500">

  <label for="length">Length, L (m)</label>
  <input type="number" id="length" placeholder="e.g. 2" value="2">

  <label for="modulus">Young's Modulus, E (GPa)</label>
  <input type="number" id="modulus" placeholder="e.g. 200 (steel)" value="200">

  <label for="inertia">Moment of Inertia, I (mm⁴)</label>
  <input type="number" id="inertia" placeholder="e.g. 8333333" value="8333333">

  <button onclick="calculate()">Calculate Deflection</button>

  <div class="result" id="result">
    <div class="label">Maximum Deflection</div>
    <div class="value" id="resultValue">-</div>
    <div class="formula" id="formulaUsed"></div>
  </div>
</div>

<script>
function calculate() {
  const type = document.getElementById('beamType').value;
  const P = parseFloat(document.getElementById('load').value);      // N
  const L = parseFloat(document.getElementById('length').value);    // m
  const E_GPa = parseFloat(document.getElementById('modulus').value); // GPa
  const I_mm4 = parseFloat(document.getElementById('inertia').value); // mm^4

  if (!P || !L || !E_GPa || !I_mm4) {
    alert('Please fill all fields with valid numbers.');
    return;
  }

  // Convert to consistent SI units (meters, Pascals)
  const E = E_GPa * 1e9;              // GPa -> Pa
  const I = I_mm4 * 1e-12;            // mm^4 -> m^4

  let deflection, formulaText;

  if (type === 'simply-supported') {
    // y_max = P L^3 / (48 E I)
    deflection = (P * Math.pow(L, 3)) / (48 * E * I);
    formulaText = 'y_max = PL³ / (48EI)';
  } else {
    // Cantilever: y_max = P L^3 / (3 E I)
    deflection = (P * Math.pow(L, 3)) / (3 * E * I);
    formulaText = 'y_max = PL³ / (3EI)';
  }

  const deflectionMM = deflection * 1000; // meters -> mm

  document.getElementById('resultValue').textContent = deflectionMM.toFixed(4) + ' mm';
  document.getElementById('formulaUsed').textContent = formulaText;
  document.getElementById('result').classList.add('show');
}
</script>
</body>
</html>
